name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://bcsrqykmzu2344bp5urt2emhni0ohvhx.lambda-url.us-east-1.on.aws
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dXAtZ25hdC04My5jbGVyay5hY2NvdW50cy5kZXYk
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The inherited codebase has pre-existing ESLint errors; production
      # TypeScript compilation remains a required CI gate.
      - run: npm run test:run -- --testTimeout=15000
      - run: npm run build
